; Ajustes de producción para el contenedor del backend.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; Sin error_log: PHP escribe en stderr y FPM lo reenvía al log del contenedor (catch_workers_output).
cgi.fix_pathinfo = 0
upload_max_filesize = 3M
post_max_size = 8M
date.timezone = America/Bogota
; Cookies de sesión más seguras (la sesión vive en MySQL, ver bootstrap.php).
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
