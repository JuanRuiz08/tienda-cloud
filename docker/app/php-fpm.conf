[global]
daemonize = no
; Los logs de FPM van a stderr (salida estándar del contenedor), no a un archivo local.
error_log = /proc/self/fd/2

[www]
; Sin "user"/"group": el contenedor ya arranca como www-data (no root).
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Las variables de entorno del contenedor deben llegar a PHP (getenv).
clear_env = no
; Lo que PHP escribe en stderr/stdout se reenvía al log del contenedor, sin prefijo extra.
catch_workers_output = yes
decorate_workers_output = no

; Se ejecuta antes de cada script: logs, sesiones en BD y utilidades.
php_admin_value[auto_prepend_file] = /var/www/html/bootstrap.php
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
