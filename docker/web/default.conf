# nginx: sirve lo estático y reenvía los .php al contenedor "app" (FastCGI, puerto 9000).
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    client_max_body_size 5m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = / { return 302 /inicio.php; }

    # Código compartido (no es una página): no debe poder ejecutarse por URL.
    location ^~ /includes/ { return 404; }

    # Imágenes subidas (volumen compartido, solo lectura). ^~ evita que algo ahí se ejecute como PHP.
    location ^~ /uploaded_img/ {
        try_files $uri =404;
        expires 7d;
    }

    location ~* \.(css|js|jpe?g|png|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/html;
        fastcgi_read_timeout 60s;
    }

    location / { return 404; }
}
